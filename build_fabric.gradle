plugins {
	id 'net.fabricmc.fabric-loom' version '1.19.3'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Loader outputs stay independent when the all-JAR script switches builds.
layout.buildDirectory = layout.projectDirectory.dir('build/fabric')
tasks.withType(Jar).configureEach {
    destinationDirectory = layout.projectDirectory.dir('build/libs')
}


sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    exclusiveContent {
        forRepository {
            flatDir {
                name = 'localCoroUtil'
                dirs rootProject.file('../CoroUtil/build/libs')
            }
        }
        filter { includeGroup 'com.corosus.coroutil' }
    }

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Complete Config repos
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url "https://maven.terraformersmc.com/"
	}
	maven {
		url "https://maven.shedaniel.me/"
	}
	maven {
		url "https://maven.siphalor.de/"
	}
	maven {
		url "https://maven.isxander.dev/releases"
	}
	maven {
		name = "ParchmentMC"
		url = "https://maven.parchmentmc.net/"
	}
	maven {
		url "https://cursemaven.com"
	}
	flatDir {
		dir 'libs'
	}
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "com.corosus.coroutil:coroutil-fabric:${project.coroutil_version}"
	include "com.corosus.coroutil:coroutil-fabric:${project.coroutil_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation 'com.electronwill.night-config:core:3.7.3'
	implementation 'com.electronwill.night-config:toml:3.7.3'
}

//If there's mixins
loom {
	// Keep the native client/common jars separate; no legacy class merger.
	splitMinecraftJar()
	runs.configureEach { runDir "run/fabric" }
	accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
}

sourceSets {
	main {
		java {
			exclude "com/corosus/${project.mod_id}/api/forge/**"
			exclude "com/corosus/${project.mod_id}/loader/forge/**"
			exclude "com/corosus/${project.mod_id}/loader/neoforge/**"
		}
	}
}

base {
	archivesName = "${project.archives_base_name}-fabric"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "mod_id": project.mod_id, "version": project.version, "mod_name": project.mod_name, "mod_description": project.mod_description, "mod_authors": project.mod_authors, "mod_license": project.mod_license
	}

	exclude("META-INF/mods.toml")
	exclude("META-INF/neoforge.mods.toml")
	exclude("META-INF/accesstransformer.cfg")
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	//withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

tasks.register('exportReleaseJar') {
	dependsOn tasks.named('jar')
	doLast {
		def outDir = rootProject.file('jar')
		outDir.mkdirs()
		outDir.listFiles()?.findAll { it.name.startsWith('watut-fabric-') && it.name.endsWith('.jar') }?.each { it.delete() }
		def built = tasks.named('jar', Jar).get().archiveFile.get().asFile
		java.nio.file.Files.copy(built.toPath(), outDir.toPath().resolve(built.name))
	}
}

tasks.named('build') {
	finalizedBy 'exportReleaseJar'
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Publishing is opt-in: the legacy publisher brings an ASM version incompatible with Java 25.
if (providers.gradleProperty('enableModPublishing').getOrElse('false').toBoolean()) {
    apply from: 'gradle/mod-publishing.gradle'
}

tasks.named('test') { useJUnitPlatform() }

apply from: 'gradle/verify-bundled-coroutil.gradle'
